# Netlify settings for the FAB Donation Tree.
# Nothing to build: index.html is ready to show as it is.
[build]
  publish = "."
  command = ""

# Always check for the newest tree, so updates appear straight away.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
