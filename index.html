:root{
  /* Layout: one 4:5 scene card holding the whole tree, with the key to the decorations and an invite underneath */
  --fab-red:#E84432;
  --fab-orange:#EE8146;
  --fab-yellow:#FFD483;
  --pine:#24592F;
  --ink:#3A1D12;
  --cream:#FFF8EE;
  --display:"Canda Tawa","Segoe Print","Comic Sans MS",cursive;
  --body:"Aleo",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--cream);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 40px;display:grid;gap:22px}
.stage{position:relative;aspect-ratio:1080/1350;border-radius:28px;overflow:hidden;background:var(--fab-red);
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 24px 50px -18px rgba(150,50,20,.45),0 6px 16px -6px rgba(150,50,20,.3)}
.stage svg{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none}
.t-display{font-family:var(--display)}
.t-body{font-family:var(--body)}
.bauble{cursor:pointer;outline:none}
.focus-ring{opacity:0;transition:opacity .15s}
.ghost{cursor:pointer;outline:none}
.bauble:focus-visible .focus-ring,.ghost:focus-visible .focus-ring{opacity:1}

/* hover / tap card */
.card{position:absolute;left:0;top:0;width:250px;background:#fff;border-radius:18px;padding:14px;display:grid;gap:10px;
  box-shadow:0 18px 40px -12px rgba(60,20,5,.45),0 2px 6px rgba(60,20,5,.18);
  pointer-events:auto;opacity:0;transform-origin:50% 100%;transition:opacity .16s ease}
.card.show{opacity:1}
.card[hidden]{display:none}
.card-plate{height:74px;border-radius:12px;display:grid;place-items:center;padding:10px 16px}
.card-plate img{max-width:100%;max-height:54px;width:auto;height:auto;object-fit:contain;display:block}
.card-tier{margin:0;font-size:13px;letter-spacing:.02em;color:#9A4A1F;display:flex;align-items:center;gap:6px}
.card-tier i{width:10px;height:10px;border-radius:50%;display:inline-block}
.card-name{margin:0;font-weight:700;font-size:19px;line-height:1.2;text-wrap:balance}
.card-link{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--fab-red);color:#fff;text-decoration:none;
  font-weight:700;font-size:15px;padding:10px 14px;border-radius:999px}
.card-link:hover{background:#cf3727}
.card-link:focus-visible{outline:3px solid var(--fab-yellow);outline-offset:2px}

/* key + invite */
.key{display:grid;gap:16px}
.key-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
.key h2{margin:0;font-family:var(--display);font-weight:400;font-size:34px;color:var(--fab-red);line-height:1.05;text-wrap:balance}
.count{margin:0;font-size:15px;color:#8a4a26}
.count b{color:var(--ink)}
.tiers{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.tiers li{background:#fff;border-radius:16px;padding:12px 8px 12px;display:grid;justify-items:center;gap:4px;text-align:center;
  box-shadow:0 1px 0 rgba(232,68,50,.06),0 6px 18px -10px rgba(150,50,20,.35)}
.tiers svg{width:58px;height:74px;display:block}
.tiers .nm{font-weight:700;font-size:14px;line-height:1.2}
.tiers .amt{font-size:14px;color:#9A4A1F;font-variant-numeric:tabular-nums}
.invite{display:grid;gap:16px;background:var(--fab-yellow);border-radius:20px;padding:18px 18px 14px}
.invite p{margin:0;font-size:16px;line-height:1.45}
/* the two big buttons: buy a bauble (payment form) and request an invoice (email) */
.cta{display:flex;flex-wrap:wrap;gap:12px}
.cta .btn{flex:1 1 auto;justify-content:center;text-align:center;font-size:19px;line-height:1.2;padding:16px 20px;min-height:62px;gap:10px;
  box-shadow:0 10px 22px -12px rgba(120,30,10,.55)}
.cta .btn svg{flex:none;width:26px;height:26px}
.cta .btn span{text-wrap:balance}
.btn-buy{background:var(--fab-red);color:#fff}
.btn-buy:hover{background:#cf3727}
.btn-invoice{background:#fff;color:var(--ink);box-shadow:0 0 0 2.5px var(--fab-red) inset,0 10px 22px -12px rgba(120,30,10,.45)!important}
.btn-invoice:hover{background:#fff3e2}
.btn-invoice svg{color:var(--fab-red)}
.invite-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 14px}
.invite .cta-note{font-size:14px;color:#6b3418}
.cta-note a{color:var(--ink);font-weight:700}
.replay{appearance:none;border:0;background:none;font:inherit;font-size:14px;color:#8a4a26;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px 0}
.replay:hover{color:var(--ink)}
.replay:focus-visible,.cta-note a:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:4px}
.btn{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:700;font-size:16px;border-radius:999px;padding:12px 20px;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn-main{background:var(--fab-red);color:#fff}
.btn-main:hover{background:#cf3727}
.btn-soft{background:#fff;color:var(--ink)}
.btn-soft:hover{background:#fff3e2}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
/* #social: full-bleed 9:16 version used to record clips for Reels, TikTok and Stories */
.social body{background:#E84432}
.social .wrap{max-width:none;padding:0;gap:0}
.social .stage{aspect-ratio:9/16;border-radius:0;box-shadow:none}
.social .key{display:none}
@media (max-width:620px){
  .tiers{grid-template-columns:repeat(3,1fr)}
  .key h2{font-size:30px}
  .stage{border-radius:20px}
}
@media (max-width:560px){
  .cta .btn{flex-basis:100%;padding:15px 16px}
}
@media (max-width:480px){
  .tiers{grid-template-columns:1fr;gap:8px}
  .tiers li{grid-template-columns:44px 1fr auto;justify-items:start;align-items:center;text-align:left;gap:12px;padding:8px 14px}
  .tiers svg{width:36px;height:46px}
}
</style>

const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = rng(20261117);
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2;
const easeOutBack = t => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); };
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const SOCIAL = location.hash === "#social";
const W = 1080, H = 1350, CX = 540;
const VIEW = SOCIAL ? {y:-110, h:1920} : {y:0, h:1350};
if (SOCIAL){ document.documentElement.classList.add("social"); $("scene").setAttribute("viewBox", `0 ${VIEW.y} 1080 ${VIEW.h}`); }
const defs = $("defs");

function linGrad(id, stops, x1=0, y1=0, x2=0, y2=1){
  const g = el("linearGradient", {id, x1, y1, x2, y2}, defs);
  stops.forEach(([o,c,a]) => el("stop", {offset:o, "stop-color":c, "stop-opacity": a==null?1:a}, g));
  return g;
}
function radGrad(id, stops, cx=.5, cy=.5, r=.5, fx, fy){
  const at = {id, cx, cy, r}; if (fx!=null){ at.fx = fx; at.fy = fy; }
  const g = el("radialGradient", at, defs);
  stops.forEach(([o,c,a]) => el("stop", {offset:o, "stop-color":c, "stop-opacity": a==null?1:a}, g));
  return g;
}

/* ------------------------------------------------------------------ painting helpers (canvas, drawn once) */
const READY = [];
function paintedLayer(parent, x, y, w, h, paint, waitFor){
  const img = el("image", {x, y, width:w, height:h, preserveAspectRatio:"none"}, parent);
  READY.push((async () => {
    if (waitFor) { try { await waitFor; } catch(e){} }
    const S = 2, cv = document.createElement("canvas");
    cv.width = Math.round(w*S); cv.height = Math.round(h*S);
    const c = cv.getContext("2d"); c.scale(S, S); c.translate(-x, -y);
    paint(c);
    await new Promise(res => cv.toBlob(b => { img.setAttribute("href", URL.createObjectURL(b)); res(); }, "image/png"));
  })());
  return img;
}
// one tapered brush mark
function brush(c, x, y, ang, len, w, col, bend){
  const dx = Math.cos(ang), dy = Math.sin(ang), nx = -dy, ny = dx, n = 10, L = [], R = [];
  for (let i=0;i<=n;i++){
    const t = i/n, off = bend*Math.sin(Math.PI*t)*len*.18;
    const px = x + dx*len*t + nx*off, py = y + dy*len*t + ny*off;
    const ww = w*.5*Math.min(1, t*5)*Math.pow(1 - t, .7) + .25;
    L.push([px + nx*ww, py + ny*ww]); R.push([px - nx*ww, py - ny*ww]);
  }
  c.fillStyle = col; c.beginPath(); c.moveTo(L[0][0], L[0][1]);
  for (const p of L) c.lineTo(p[0], p[1]);
  for (let i=R.length-1;i>=0;i--) c.lineTo(R[i][0], R[i][1]);
  c.closePath(); c.fill();
}
function rgba(hex, a){ const n = parseInt(hex.slice(1),16); return `rgba(${n>>16},${n>>8&255},${n&255},${a})`; }

/* ------------------------------------------------------------------ the tree: one hand-painted shape, in the style of last year's */
const TREE_TIERS = [ // half-width and height of each side tip, then of the notch where the next tier starts
  {tw:150, ty:400, nw:80,  ny:428},
  {tw:236, ty:540, nw:142, ny:568},
  {tw:314, ty:680, nw:204, ny:708},
  {tw:386, ty:820, nw:266, ny:848},
  {tw:448, ty:958, nw:326, ny:986},
  {tw:470, ty:1082}
];
const APEX_Y = 254, BOTTOM_Y = 1104;
const OUTLINE = {}, TIPS = [];
(function outline(){
  for (const side of [1, -1]){
    const T = TREE_TIERS.map(t => ({tw:t.tw + (rand()-.5)*16, ty:t.ty + (rand()-.5)*12,
      nw: t.nw == null ? null : t.nw + (rand()-.5)*12, ny: t.ny == null ? null : t.ny + (rand()-.5)*8}));
    const raw = [[0, APEX_Y]];
    const quad = (x0,y0,cx,cy,x1,y1) => {
      const n = Math.max(6, Math.round(Math.hypot(x1-x0, y1-y0)/4));
      for (let i=1;i<=n;i++){ const s = i/n, u = 1-s; raw.push([u*u*x0 + 2*u*s*cx + s*s*x1, u*u*y0 + 2*u*s*cy + s*s*y1]); }
    };
    let px = 0, py = APEX_Y;
    T.forEach((t, i) => {
      quad(px, py, px + (t.tw - px)*.3, py + (t.ty - py)*.88, t.tw, t.ty);   // sweep out to the tip
      TIPS.push({x: CX + side*t.tw, y: t.ty, tier: i, side});
      if (t.nw != null){ quad(t.tw, t.ty, t.tw - (t.tw - t.nw)*.42, t.ny + 8, t.nw, t.ny); px = t.nw; py = t.ny; }
      else quad(t.tw, t.ty, t.tw*.5, BOTTOM_Y + 10, 0, BOTTOM_Y);
    });
    // a gentle hand-drawn wobble, kept away from the tips
    const ph1 = rand()*6.28, ph2 = rand()*6.28; let len = 0;
    const out = raw.map((p, i) => {
      if (i === 0 || i === raw.length-1) return p;
      const a = raw[i-1], b = raw[i+1];
      len += Math.hypot(p[0]-a[0], p[1]-a[1]);
      const tx = b[0]-a[0], ty = b[1]-a[1], tl = Math.hypot(tx, ty) || 1;
      const nearTip = Math.min(...T.map(t => Math.hypot(p[0]-t.tw, p[1]-t.ty)));
      const n = (1.8*Math.sin(len/21 + ph1) + 1.1*Math.sin(len/8.5 + ph2))*Math.min(1, nearTip/26);
      return [p[0] - ty/tl*n, p[1] + tx/tl*n];
    });
    OUTLINE[side] = out.map(([x, y]) => [CX + side*x, y]);
  }
})();
function halfWidth(side, y){
  const P = OUTLINE[side]; let best = 0;
  for (let i=1;i<P.length;i++){
    const y0 = P[i-1][1], y1 = P[i][1];
    if ((y0 - y)*(y1 - y) <= 0 && y0 !== y1){ const x = P[i-1][0] + (P[i][0] - P[i-1][0])*(y - y0)/(y1 - y0); best = Math.max(best, side*(x - CX)); }
  }
  return best;
}
function treePathD(){
  const pts = OUTLINE[1].concat(OUTLINE[-1].slice().reverse());
  return "M" + pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join("L") + "Z";
}
function paintTree(c){
  // trunk
  c.fillStyle = "#6A4A2B"; c.fillRect(512, 1060, 58, 112);
  for (let i=0;i<46;i++) brush(c, 513 + rand()*55, 1060 + rand()*50, Math.PI/2 + (rand()-.5)*.08, 40 + rand()*70, 2 + rand()*3,
    rand() < .6 ? "rgba(58,37,20,.5)" : "rgba(150,110,66,.35)", rand()-.5);
  const path = new Path2D(treePathD());
  c.fillStyle = "#44733A"; c.fill(path);
  c.save(); c.clip(path);
  const inside = (x, y) => { const s = x < CX ? -1 : 1; return s*(x - CX) < halfWidth(s, y); };
  // shade under each tier's overhang
  TREE_TIERS.forEach((t, i) => {
    if (i === 0) return;
    const top = TREE_TIERS[i-1].ny;
    for (let k=0;k<70;k++){
      const y = top - 10 + Math.pow(rand(), 1.7)*80, x = CX + (rand()*2 - 1)*halfWidth(1, y);
      const r = (x - CX)/Math.max(1, halfWidth(x < CX ? -1 : 1, y));
      brush(c, x, y, Math.PI/2 - r*.8 + (rand()-.5)*.3, 26 + rand()*50, 5 + rand()*7, `rgba(33,62,28,${(.18 + rand()*.22).toFixed(2)})`, rand()-.5);
    }
  });
  // the painted needles
  const darks = ["#2F5A2A","#355F2E","#3A6633","#28502A"], lights = ["#5C8B4C","#679759","#557F45","#78A564"];
  let made = 0, tries = 0;
  // a few broad, soft washes first, like a big brush
  for (let k=0;k<90;k++){
    const x = CX - 470 + rand()*940, y = APEX_Y + 20 + rand()*(BOTTOM_Y - APEX_Y - 20);
    if (!inside(x, y)) continue;
    const sd = x < CX ? -1 : 1, rr = clamp((x - CX)/Math.max(1, halfWidth(sd, y)), -1, 1);
    brush(c, x, y, Math.PI/2 - rr*.7 + (rand()-.5)*.3, 70 + rand()*90, 18 + rand()*16, rand() < .7 ? "rgba(40,78,36,.10)" : "rgba(98,146,82,.09)", rand()-.5);
  }
  while (made < 700 && tries++ < 6000){
    const x = CX - 480 + rand()*960, y = APEX_Y + 4 + rand()*(BOTTOM_Y - APEX_Y);
    if (!inside(x, y)) continue;
    made++;
    const s = x < CX ? -1 : 1, r = clamp((x - CX)/Math.max(1, halfWidth(s, y)), -1, 1);
    const light = rand() < .14;
    const col = light ? lights[made % 4] : darks[made % 4];
    const a = light ? .14 + rand()*.16 : .16 + rand()*.26;
    brush(c, x, y, Math.PI/2 - r*.8 + (rand()-.5)*.45, light ? 24 + rand()*44 : 36 + rand()*80,
      light ? 4 + rand()*5 : 6 + rand()*9, rgba(col, a.toFixed(2)), (rand()-.5)*1.2);
  }
  // soft warm light from the star
  const gl = c.createRadialGradient(CX + 50, 320, 20, CX + 50, 320, 560);
  gl.addColorStop(0, "rgba(255,226,150,.1)"); gl.addColorStop(1, "rgba(255,226,150,0)");
  c.fillStyle = gl; c.fillRect(0, 0, W, H);
  c.restore();
}

const BULBS = [];
(function tree(){
  const g = $("layer-tree");
  paintedLayer(g, 40, 230, 1000, 950, paintTree);
  // strings of lights, like last year's
  const swags = [[470, 66, -16], [612, 76, 16], [754, 84, -14], [896, 90, 14]];
  swags.forEach(([y0, sag, tilt], i) => {
    const yL = y0 - tilt, yR = y0 + tilt;
    const xL = CX - halfWidth(-1, yL)*.97, xR = CX + halfWidth(1, yR)*.97;
    const yLow = (yL + yR)/2 + sag, cY = 2*yLow - (yL + yR)/2, cX = CX + tilt*2;
    const wire = el("g", {}, g);
    el("path", {d:`M${xL},${yL} Q${cX},${cY} ${xR},${yR}`, fill:"none", stroke:"#F0DBA6", "stroke-opacity":.9, "stroke-width":2.2, "stroke-linecap":"round"}, wire);
    const pts = []; let prev = null, len = 0;
    for (let s=0;s<=1.0001;s+=.005){
      const u = 1-s, x = u*u*xL + 2*u*s*cX + s*s*xR, y = u*u*yL + 2*u*s*cY + s*s*yR;
      if (prev) len += Math.hypot(x-prev[0], y-prev[1]);
      pts.push([x,y,len]); prev = [x,y];
    }
    const gap = 50, count = Math.floor(len/gap), offset = (len - count*gap)/2;
    let j = 0;
    for (let k=0;k<=count;k++){
      const target = offset + k*gap;
      while (j < pts.length-1 && pts[j][2] < target) j++;
      const [x, y] = pts[j];
      const warm = (k + i) % 4 === 0;
      const glow = el("circle", {cx:x, cy:y+3, r:17, fill: warm ? "url(#bulb1)" : "url(#bulb0)"}, wire);
      el("circle", {cx:x, cy:y+3, r:6, fill:"url(#bulbCore)"}, wire);
      BULBS.push({glow, ph: rand()*6.28, sp: .7 + rand()*1.2});
    }
  });
})();

function wobbly(c, pts){
  c.beginPath();
  pts.forEach(([x, y], i) => { const jx = (rand()-.5)*1.6, jy = (rand()-.5)*1.6; i ? c.lineTo(x + jx, y + jy) : c.moveTo(x + jx, y + jy); });
  c.closePath();
}
function paintFace(c, pts, col, f, p, kind){
  c.save(); wobbly(c, pts); c.fillStyle = shade(col, f); c.fill(); c.clip();
  const xs = pts.map(q => q[0]), ys = pts.map(q => q[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (p.pat === "dots"){
    const n = Math.round((x1 - x0)*(y1 - y0)/260);
    for (let i=0;i<n;i++){ c.fillStyle = shade(p.pc, f); c.beginPath(); c.arc(x0 + rand()*(x1-x0), y0 + rand()*(y1-y0), 2.6 + rand()*2.2, 0, Math.PI*2); c.fill(); }
  }
  if (p.pat === "stripes"){
    c.strokeStyle = shade(p.pc, f); c.lineWidth = 7;
    for (let s = x0 - (y1 - y0); s < x1; s += 19){ c.beginPath(); c.moveTo(s, y1); c.lineTo(s + (y1 - y0), y0); c.stroke(); }
  }
  // paper texture
  for (let i=0;i<Math.max(14, (x1-x0)*(y1-y0)/180);i++){
    brush(c, x0 + rand()*(x1-x0), y0 + rand()*(y1-y0), Math.PI/2 + (rand()-.5)*.6, 10 + rand()*24, 1.5 + rand()*3,
      rand() < .5 ? "rgba(70,30,10,.07)" : "rgba(255,250,235,.10)", rand()-.5);
  }
  c.restore();
}
function paintPresent(c, p){

    c.beginPath(); c.moveTo(bx, by);
    c.bezierCurveTo(bx + dir*12*s, by - 34*s, bx + dir*46*s, by - 26*s, bx + dir*36*s, by - 4*s);

  }
}

function shade(hex, f){
  const n = parseInt(hex.slice(1),16); let r = n>>16, g = n>>8&255, b = n&255;
  if (f > 1){ r += (255 - r)*(f - 1)*1.4; g += (255 - g)*(f - 1)*1.4; b += (255 - b)*(f - 1)*1.4; }
  else { r *= f; g *= f; b *= f; }
  r = clamp(Math.round(r),0,255); g = clamp(Math.round(g),0,255); b = clamp(Math.round(b),0,255);
  return "#" + ((1<<24) + (r<<16) + (g<<8) + b).toString(16).slice(1);
}

/* ------------------------------------------------------------------ bauble hooks
   Hooks are tried in this order. Each new business takes the first hook where its
   bauble fits without touching another one, so existing baubles never move.
   [height on the tree, position across (-1 left edge to 1 right edge), thread length]
   or ["tip", tier, side, thread length] to hang from the end of a branch */
const HOOK_PLAN = [
  [712, .2, 22], [588, -.52, 18], [858, -.36, 20], [470, .46, 14], [722, -.72, 14], [866, .64, 18],
  ["tip", 1, 1, 12], ["tip", 2, -1, 12], ["tip", 3, 1, 12], ["tip", 4, -1, 10], ["tip", 2, 1, 12], ["tip", 3, -1, 12],
  [600, .44, 14], [978, .28, 8], [972, -.6, 8], [430, -.3, 10], [790, .02, 34], [520, -.1, 14], ["tip", 1, -1, 10], ["tip", 4, 1, 10]
];
const HOOKS = [];
(function hooks(){
  const add = (hx, hy, L) => { if (!HOOKS.some(h => Math.abs(h.hx - hx) < 2 && Math.abs(h.hy - hy) < 2)) HOOKS.push({hx, hy, L}); };
  for (const p of HOOK_PLAN){
    if (p[0] === "tip"){
      const tip = TIPS.find(t => t.tier === p[1] && t.side === p[2]);
      if (tip){ add(tip.x - tip.side*10, tip.y - 2, p[3]); HOOKS[HOOKS.length-1].tip = true; }
    } else {
      const [y, u, L] = p, side = u < 0 ? -1 : 1;
      add(CX + u*halfWidth(side, y)*.9, y, L);
    }
  }
  // spare hooks for a very full tree
  for (let y = 430; y <= 1000; y += 52)
    for (const u of [-.82, -.5, -.18, .14, .46, .8]){ const side = u < 0 ? -1 : 1; add(CX + u*halfWidth(side, y)*.9, y, 8); }
})();
const TAKEN = [];
const FLOOR = 1232;
let SCALE = 1; // baubles shrink a little if the tree gets very full
function footprint(h, kind){
  if (kind === "candy") return {x:h.hx - 4*SCALE, y:h.hy + (h.L + 48)*SCALE, r:50*SCALE};
  const R = kind === "ghost" ? 26 : TIER[kind].R*SCALE;
  const L = kind === "ghost" ? Math.max(10, h.L*.6) : h.L;
  return {x:h.hx, y:h.hy + (L + 18)*(kind === "ghost" ? 1 : SCALE) + R, r:R + 5};
}
function fits(c){
  return c.y + c.r < FLOOR && c.x - c.r > 14 && c.x + c.r < W - 14 && !TAKEN.some(o => Math.hypot(o.x - c.x, o.y - c.y) < o.r + c.r + 6);
}
function claimHook(kind){
  for (const h of HOOKS){
    if (h.used) continue;
    const c = footprint(h, kind);
    if (fits(c)){ h.used = true; TAKEN.push(c); return h; }
  }
  return null;
}

  el("circle", {class:"focus-ring", cx:0, cy, r:R+7, fill:"none", stroke:"#FFF8EE", "stroke-width":4, "stroke-dasharray":"6 6"}, g);

/* ------------------------------------------------------------------ hang everything */
const GLITTER = [];
const SWINGERS = [];
const placed = [];
(function hang(){
  const gl = $("layer-ghosts"), bl = $("layer-baubles");
  // find the largest bauble size at which every business fits
  let plan = [];
  for (SCALE = 1; SCALE >= .5; SCALE = +(SCALE - .05).toFixed(2)){
    HOOKS.forEach(h => h.used = false); TAKEN.length = 0;
    plan = SUPPORTERS.map(sup => claimHook(sup.tier));
    if (plan.every(Boolean)) break;
  }
  SUPPORTERS.forEach((sup, i) => {
    const slot = plan[i];
    if (!slot){ console.warn("No room left on the tree for", sup.name); return; }
    const a = el("a", {class:"bauble", href:sup.url, target:"_blank", rel:"noopener",
      "aria-label":`${sup.name}, ${TIER[sup.tier].label}. Visit their website.`}, bl);
    const sw = el("g", {}, a);
    const pos = el("g", {transform:`translate(${slot.hx},${slot.hy}) scale(${SCALE})`}, sw);
    const shape = sup.tier === "candy" ? drawCandy(pos, {L:slot.L, name:sup.name})
                : drawBauble(pos, {tier:sup.tier, L:slot.L, logo:sup.logo, plate:sup.plate, logoRatio:sup.logoRatio});
    const s = {node:sw, pos, hx:slot.hx, hy:slot.hy, amp:2.6, per:3.4 + rand()*1.6, ph:rand()*6.28, sup, shape, extra:0};
    SWINGERS.push(s); placed.push(s);
    wireCard(a, sup, shape);
  });
  // free spots shown as clear glass baubles
  let slot, ghosts = 0;
  HOOKS.forEach(h => { if (h.tip) h.used = true; });   // spare glass stays inside the tree
  while (ghosts++ < 6 && (slot = claimHook("ghost"))){
    const a = el("a", {class:"ghost", href:INVITE_URL, target:"_blank", rel:"noopener", "aria-label":"A free spot on the tree. Buy your bauble to hang your business here."}, gl);
    const sw = el("g", {}, a);
    const pos = el("g", {transform:`translate(${slot.hx},${slot.hy})`}, sw);
    const shape = drawGhost(pos, Math.max(10, slot.L*.6));
    SWINGERS.push({node:sw, hx:slot.hx, hy:slot.hy, amp:2.2, per:3.6 + rand()*1.8, ph:rand()*6.28});
    wireCard(a, null, shape);
  }
  $("count").innerHTML = `<b>${placed.length}</b> ${placed.length === 1 ? "business" : "businesses"} on our tree so far`;
})();

/* ------------------------------------------------------------------ card */
const card = $("card"), stage = $("stage");
let openFor = null, lastPointer = "mouse", hideTimer = null;
document.addEventListener("pointerdown", e => { lastPointer = e.pointerType || "mouse"; }, true);
function wireCard(a, sup, shape){
  a.addEventListener("mouseenter", () => { if (lastPointer !== "touch") showCard(sup, shape); });
  a.addEventListener("mouseleave", () => { if (lastPointer !== "touch") scheduleHide(); });
  a.addEventListener("focus", () => showCard(sup, shape));
  a.addEventListener("blur", () => scheduleHide());
  a.addEventListener("click", e => {
    if (lastPointer === "touch" && openFor !== shape){ e.preventDefault(); showCard(sup, shape); }
  });
}
card.addEventListener("mouseenter", () => clearTimeout(hideTimer));
card.addEventListener("mouseleave", () => scheduleHide());
document.addEventListener("click", e => {
  if (!card.hidden && !card.contains(e.target) && !e.target.closest(".bauble,.ghost")) hideCard();
});
function scheduleHide(){ clearTimeout(hideTimer); hideTimer = setTimeout(hideCard, 160); }
function hideCard(){ card.classList.remove("show"); openFor = null; setTimeout(() => { if (!openFor) card.hidden = true; }, 170); }
function showCard(sup, shape){
  clearTimeout(hideTimer);
  openFor = shape;
  const plate = $("cardPlate"), logo = $("cardLogo"), link = $("cardLink");
  if (sup){
    plate.style.display = ""; plate.style.background = sup.plate || "#fff"; logo.src = sup.logo; logo.alt = sup.name + " logo";
    $("cardTier").innerHTML = `<i style="background:${TIER[sup.tier].dot}"></i>${TIER[sup.tier].label}`;
    $("cardName").textContent = sup.name;
    link.href = sup.url; link.textContent = "Visit their website ↗";
  } else {
    plate.style.display = "none";
    $("cardTier").innerHTML = `<i style="background:#FFD483;box-shadow:0 0 0 1px #E9B54A inset"></i>Free spot`;
    $("cardName").textContent = "Your business's bauble could hang here";
    link.href = INVITE_URL; link.textContent = "Buy your bauble here ↗";
  }
  card.hidden = false;
  const sr = stage.getBoundingClientRect();
  const target = shape.g.querySelector(".sphere") || shape.g;
  const br = target.getBoundingClientRect();
  const cw = card.offsetWidth, ch = card.offsetHeight;
  let x = br.left - sr.left + br.width/2 - cw/2;
  x = clamp(x, 10, sr.width - cw - 10);
  let y = br.top - sr.top - ch - 14;
  if (y < 10) y = br.bottom - sr.top + 14;
  card.style.transform = `translate(${Math.round(x)}px,${Math.round(y)}px)`;
  requestAnimationFrame(() => card.classList.add("show"));
}

/* ------------------------------------------------------------------ animation */
const newest = placed[placed.length-1];
let arrival = null;
function startArrival(){
  if (!newest) return;
  setBanner(newest.sup);
  if (reduceMotion || !CELEBRATE_NEWEST){ BANNER.g.setAttribute("opacity", 1); return; }
  arrival = {t0: clock()};
  BANNER.g.setAttribute("opacity", 0);
  newest.node.setAttribute("opacity", 0);
}
$("replay").addEventListener("click", () => { hideCard(); startArrival(); });

let clockOverride = null;
const clock = () => clockOverride != null ? clockOverride : performance.now();
// used to record social clips frame by frame: __startCapture(), then __renderAt(ms) for each frame
window.__startCapture = () => { clockOverride = 0; last = 0; hideCard(); startArrival(); frame(0, true); };
window.__renderAt = ms => { clockOverride = ms; frame(ms, true); };
// gentle push-in on the newest bauble and its banner (used by the social clip recorder), k from 0 to 1
window.__camera = k => {
  if (!newest) return;
  const z = 1 + .34*k, w = W/z, h = VIEW.h/z;
  const fx = CX, fy = (newest.hy + newest.shape.cy*SCALE + BANNER.y)/2 - 70;
  const cx = CX + (fx - CX)*k, cy = (VIEW.y + VIEW.h/2) + (fy - (VIEW.y + VIEW.h/2))*k;
  const x = clamp(cx - w/2, 0, W - w), y = clamp(cy - h/2, VIEW.y, VIEW.y + VIEW.h - h);
  $("scene").setAttribute("viewBox", `${x.toFixed(2)} ${y.toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)}`);
};
let last = performance.now();
function frame(now, manual){
  if (clockOverride != null && !manual) return;
  const dt = Math.min(.05, Math.max(0, (now - last)/1000)); last = now;
  const t = now/1000;
  // sway
  for (const s of SWINGERS){
    if (arrival && s === newest) continue;
    const a = (s.amp + (s.extra || 0)) * Math.sin(t*2*Math.PI/s.per + s.ph);
    if (s.extra) s.extra *= Math.pow(.42, dt);
    if (s.extra < .05) s.extra = 0;
    s.node.setAttribute("transform", `rotate(${a.toFixed(2)} ${s.hx} ${s.hy})`);
  }
  // lights
  for (const b of BULBS) b.glow.setAttribute("opacity", (.55 + .45*Math.sin(t*b.sp + b.ph)).toFixed(2));
  for (const gdot of GLITTER) gdot.dot.setAttribute("opacity", (.25 + .75*Math.max(0, Math.sin(t*gdot.sp + gdot.ph))).toFixed(2));
  STAR.glow.setAttribute("r", (76 + 5*Math.sin(t*1.6)).toFixed(1));
  // snow
  for (const f of FLAKES){
    f.y += f.vy*dt; const x = f.x + Math.sin(t*.6 + f.ph)*f.drift;
    if (f.y > VIEW.y + VIEW.h + 6){ f.y = VIEW.y - 6; f.x = rand()*W; }
    f.c.setAttribute("cx", x.toFixed(1)); f.c.setAttribute("cy", f.y.toFixed(1));
  }
  // arrival of the newest bauble
  if (arrival){
    const e = (now - arrival.t0)/1000;
    const s = newest;
    if (e < .25){ s.node.setAttribute("opacity", 0); }
    if (e >= .25 && !arrival.flared){ arrival.flared = true; burst(STAR.cx, STAR.cy, 22, 260); }
    const flyStart = .45, flyDur = 2.1;
    if (e >= flyStart){
      const k = clamp((e - flyStart)/flyDur, 0, 1), q = easeInOut(k);
      const x0 = STAR.cx, y0 = STAR.cy - 30, x1 = s.hx, y1 = s.hy;
      const cxp = (x0 + x1)/2 + (x1 >= x0 ? -230 : 230), cyp = Math.min(y0, y1) - 60;
      const x = (1-q)*(1-q)*x0 + 2*(1-q)*q*cxp + q*q*x1;
      const y = (1-q)*(1-q)*y0 + 2*(1-q)*q*cyp + q*q*y1;
      const sc = .2 + .8*easeOutCubic(k);
      const rot = Math.sin(k*Math.PI*3)*18*(1-k);
      s.node.setAttribute("opacity", Math.min(1, (e - flyStart)*4).toFixed(2));
      s.node.setAttribute("transform", `translate(${(x - s.hx).toFixed(1)} ${(y - s.hy).toFixed(1)}) rotate(${rot.toFixed(2)} ${s.hx} ${s.hy}) translate(${s.hx} ${s.hy}) scale(${sc.toFixed(3)}) translate(${-s.hx} ${-s.hy})`);
      if (k >= 1){
        burst(s.hx, s.hy + s.shape.cy, 34, 330);
        s.extra = 13; s.ph = -t*2*Math.PI/s.per; // start the swing from centre
        arrival = null;
        bannerIn(now);
      }
    }
  }
  if (bannerAnim){
    const k = clamp((now - bannerAnim)/650, 0, 1);
    const sc = .55 + .45*easeOutBack(k);
    BANNER.g.setAttribute("opacity", Math.min(1, k*2).toFixed(2));
    BANNER.inner.setAttribute("transform", `translate(${CX} ${BANNER.y}) scale(${sc.toFixed(3)}) translate(${-CX} ${-BANNER.y})`);
    if (k >= 1) bannerAnim = null;
  }
  // particles
  for (let i=PARTS.length-1;i>=0;i--){
    const p = PARTS[i]; p.life += dt;
    p.vy += 340*dt; p.vx *= Math.pow(.35, dt); p.x += p.vx*dt; p.y += p.vy*dt; p.rot += p.vr*dt;
    const k = p.life/p.max;
    if (k >= 1){ p.p.remove(); PARTS.splice(i,1); continue; }
    p.p.setAttribute("transform", `translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${p.rot.toFixed(0)}) scale(${(1-k*.6).toFixed(2)})`);
    p.p.setAttribute("opacity", (1 - k*k).toFixed(2));
  }
  // twinkle the sky
  for (const s of SKY) s.n.setAttribute("opacity", (.25 + .65*Math.max(0, Math.sin(t*1.3 + s.ph))).toFixed(2));
  if (!manual) requestAnimationFrame(frame);
}
let bannerAnim = null;
function bannerIn(now){ bannerAnim = now; }
const SKY = [...document.querySelectorAll("#skySparkles path")].map(n => ({n, ph:+n.dataset.ph}));

document.fonts && document.fonts.ready.then(() => setBanner(newest && newest.sup));
window.__treeReady = Promise.all(READY);
startArrival();
if (reduceMotion){
  for (const f of FLAKES){ f.c.setAttribute("cx", f.x.toFixed(1)); f.c.setAttribute("cy", f.y.toFixed(1)); }
  for (const b of BULBS) b.glow.setAttribute("opacity", .85);
} else {
  requestAnimationFrame(frame);
}
</script>
</body>
